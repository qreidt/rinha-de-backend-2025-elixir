services:
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    volumes:
      - ./.docker/payment-router/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api01
      - api02
    networks:
      - rinha
    ports:
      - "9999:80"
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: "500MB"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=payment_router
    networks:
      - rinha
    volumes:
      - ./.docker/payment-router/init.sql:/docker-entrypoint-initdb.d/1-schema.sql:ro
    ports:
      - "5432:5432"
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: "500MB"

  api01:
    build: .
    image: qreidt/rinha-payment-router:latest
    restart: unless-stopped
    environment:
      - PHX_SERVER=1
      - MIX_ENV=prod
      - PHX_HOST=0.0.0.0
      - PORT=9999
      - SECRET_KEY_BASE=VKkFu4cjaSJOahHXWUq1LVDcvBfzdWv8zEtfBkb1jYQkTTOCMOBU+FTV2/uiyltg
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/payment_router
      - RELEASE_DISTRIBUTION=name
      - RELEASE_COOKIE=supersecretcookie1234567890
      - RELEASE_NODE=api01@api01.rinha
      - DNS_CLUSTER_QUERY=api.rinha
    depends_on:
      - db
    networks:
      rinha:
        aliases:
          - api01.rinha
          - api.rinha
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: "500MB"

  api02:
    build: .
    image: qreidt/rinha-payment-router:latest
    restart: unless-stopped
    environment:
      - PHX_SERVER=1
      - MIX_ENV=prod
      - PHX_HOST=0.0.0.0
      - PORT=9999
      - SECRET_KEY_BASE=VKkFu4cjaSJOahHXWUq1LVDcvBfzdWv8zEtfBkb1jYQkTTOCMOBU+FTV2/uiyltg
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/payment_router
      - RELEASE_DISTRIBUTION=name
      - RELEASE_COOKIE=supersecretcookie1234567890
      - RELEASE_NODE=api02@api02.rinha
      - DNS_CLUSTER_QUERY=api.rinha
    depends_on:
      - db
    networks:
      rinha:
        aliases:
          - api02.rinha
          - api.rinha
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: "500MB"

  # worker:
  #   image: qreidt/rinha-payment-router:latest
  #   restart: unless-stopped
  #   environment:
  #     - PHX_WORKER=1
  #     - GATEWAY_HOSTS=http://payment-processor-default:8080,http://payment-processor-fallback:8080
  #     - RELEASE_NODE=worker@worker
  #   depends_on:
  #     - db
  #   networks:
  #     - rinha
  #     - payment-processor
  #   deploy:
  #     resources:
  #       limits:
  #         cpus: "1.5"
  #         memory: "500MB"

networks:
  rinha:
    name: rinha
    driver: bridge
  backend:
    driver: bridge
  payment-processor:
    external: true
